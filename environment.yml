# environment.yml
# Create the environment:  conda env create -f environment.yml
# Activate it:              conda activate vss-colombia
# Update after changes:     conda env update -f environment.yml --prune

name: vss-colombia
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch>=2.1
  - pytorch-cuda=12.1        # adjust to your server/cluster's CUDA version
  - numpy>=1.24
  - pandas>=2.0
  - matplotlib>=3.7
  - pyyaml>=6.0
  - pip
  - pip:
      - -r requirements.txt   # single source for pip packages (transformers pin, anthropic, etc.)
